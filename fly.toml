app = "ai-news-bot"
primary_region = "hkg"

[build]

[[services]]
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared-cpu-1x"
  cpus = 1
  memory_mb = 256

[env]
  PYTHONUNBUFFERED = "1"
